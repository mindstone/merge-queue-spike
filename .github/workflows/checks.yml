name: checks
on:
  pull_request:
  merge_group:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Tests, with one retry
        run: |
          echo "event=${{ github.event_name }} ref=${{ github.ref }} sha=${{ github.sha }}"
          if node --test test/*.test.js; then exit 0; fi
          echo "::warning::first attempt failed; retrying once"
          if node --test test/*.test.js; then echo "::warning::FLAKE: passed on retry"; exit 0; fi
          exit 1
  landing-required:
    needs: [test]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - run: test "${{ needs.test.result }}" = "success"
